<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog Game - ARENA PLAYBOX</title>
    
    <link rel="icon" href="https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/logo%20arena%20gaming.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@400;500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --netflix-red: #E50914; 
            --netflix-black: #141414; 
            --netflix-dark: #181818;
            --netflix-gray: #808080;
            --netflix-light: #e5e5e5;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--netflix-black); 
            color: white; 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navbar & Headers */
        .netflix-nav {
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            transition: background-color 0.3s ease;
        }
        .netflix-nav.scrolled { background-color: var(--netflix-black); }

        /* Typography */
        h1, h2, h3 { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        /* Buttons */
        .btn-back {
            background-color: rgba(109, 109, 110, 0.7);
            color: white;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .btn-back:hover { background-color: rgba(109, 109, 110, 0.4); }

        /* Custom Horizontal Scroll for Tabs */
        .tab-scroll-container { 
            display: flex; 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch; 
            gap: 12px;
            padding-bottom: 8px;
        }
        .tab-scroll-container::-webkit-scrollbar { display: none; }
        
        .nav-tab { 
            flex: 0 0 auto; 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--netflix-light); 
            background: transparent;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .nav-tab:hover { border-color: white; color: white; }
        .nav-tab.active { background-color: white; color: black; border-color: white; }

        /* Tab Panels */
        .tab-panel { display: none; animation: fadeIn 0.5s ease; }
        .tab-panel.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Netflix Style Game Card */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 0 4px;
        }
        @media (min-width: 768px) { .game-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
        @media (min-width: 1024px) { .game-grid { grid-template-columns: repeat(6, 1fr); gap: 20px; } }

        .game-card {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3; /* Standard movie poster ratio */
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s ease;
            background-color: #222;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        /* Hover Effects */
        @media (hover: hover) {
            .game-card:hover {
                transform: scale(1.05);
                z-index: 10;
                box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            }
            .game-card:hover .card-overlay { opacity: 1; }
            .game-card:hover img { filter: brightness(0.7) blur(2px); transform: scale(1.1); }
        }

        /* Mobile specific active state to mimic hover */
        .game-card:active { transform: scale(0.98); }

        /* Info Overlay */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px;
            z-index: 2;
        }

        /* Show overlay slightly on mobile since no hover */
        @media (hover: none) {
            .card-overlay { opacity: 1; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 60%); padding: 8px; }
            .card-title { font-size: 11px !important; text-shadow: 1px 1px 2px black; }
            .tags-container { display: none !important; } /* Hide tags on mobile to keep it clean */
        }

        .card-title {
            font-size: 14px;
            font-weight: 800;
            color: white;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .match-score { color: #46d369; font-weight: 700; font-size: 10px; margin-bottom: 4px;}

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .tag {
            font-size: 8px;
            font-weight: 600;
            color: var(--netflix-light);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 2px 6px;
            border-radius: 2px;
            text-transform: uppercase;
        }

        /* Hero Banner */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 45vh;
            min-height: 300px;
            background-image: url('https://raw.githubusercontent.com/sunsetdansenja-arch/bot-arrena-assets/main/game%20poster/GOD%20OF%20WAR.jpg');
            background-size: cover;
            background-position: center 20%;
            margin-bottom: -40px; /* Pull content up */
        }
        
        .hero-vignette {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--netflix-black) 0%, transparent 60%);
        }

        .hero-content {
            position: absolute;
            bottom: 20%;
            left: 4%;
            right: 4%;
            max-width: 600px;
        }
    </style>
</head>

        // Custom Tab Switching Logic
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            
            // Handle Tab Buttons Styling
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        // Render Netflix Style Cards
        function renderCards(unitId, elementId) {
            const container = document.getElementById(elementId);
            container.innerHTML = "";
            
            gameDatabase[unitId].forEach(game => {
                // Generate Tags
                let tagsHTML = game.tags.map(t => `<span class="tag">${t}</span>`).join('');

                // Image Source Handling (Jika URL kosong, pakai generator gambar abstrak API)
                let encodedName = encodeURIComponent(game.name);
                let imgSrc = game.img ? (RAW_URL + game.img) : `https://ui-avatars.com/api/?name=${encodedName}&background=222222&color=E50914&size=300&font-size=0.15&bold=true`;

                // Calculate a fake "Match" percentage for Netflix vibe (90-99%)
                let fakeMatch = Math.floor(Math.random() * (99 - 90 + 1)) + 90;

                container.innerHTML += `
                    <div class="game-card">
                        <img src="${imgSrc}" alt="${game.name}" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${encodedName}&background=222222&color=ffffff&size=300'">
                        <div class="card-overlay">
                            <h3 class="card-title">${game.name}</h3>
                            <div class="tags-container mb-1">
                                ${tagsHTML}
                            </div>
                            <span class="match-score">${fakeMatch}% Match</span>
                        </div>
                    </div>
                `;
            });
        }

        // Initialize Render
        window.onload = function() {
            renderCards('unit3', 'list-unit3');
            renderCards('unit4', 'list-unit4');
            renderCards('unit5', 'list-unit5');
            renderCards('unit6', 'list-unit6');
        }
